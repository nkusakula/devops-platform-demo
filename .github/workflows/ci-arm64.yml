name: CI – arm64

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (arm64)
    runs-on:
      group: prod-runners-eu-west
      labels: [self-hosted, linux, arm64]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-arm64-node-${{ hashFiles('**/package-lock.json') }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build container image (arm64)
        run: |
          docker build \
            --platform linux/arm64 \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }}-arm64 .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push arm64 image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}-arm64

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign arm64 image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}:${{ github.sha }}-arm64
        env:
          COSIGN_EXPERIMENTAL: '1'
